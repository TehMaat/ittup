name: 📚 Documentation
description: Something missing or wrong in the documentation
title: "[Docs]: "
labels: ["docs", "needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or file of the page
      placeholder: "https://tehmaat.github.io/ittup/config/trackers/"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
