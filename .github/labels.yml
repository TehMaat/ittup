# Synced to the repository by .github/workflows/labels.yml. Meaning of each group: CONTRIBUTING.md
# Priority
- { name: P0, color: b60205, description: "Critical: the release doesn't ship without it" }
- { name: P1, color: d93f0b, description: "High: main goal of the milestone" }
- { name: P2, color: fbca04, description: "Medium: important, can be postponed" }
- { name: P3, color: c2e0c6, description: "Low: nice to have" }
# Type
- { name: feature, color: a2eeef, description: "New feature" }
- { name: bug, color: d73a4a, description: "Something works wrong" }
- { name: chore, color: ededed, description: "Maintenance, refactoring, tooling" }
- { name: docs, color: 0075ca, description: "Documentation" }
- { name: security, color: 5319e7, description: "Security (vulnerabilities go to a private advisory)" }
- { name: epic, color: 3e4b9e, description: "Groups several issues" }
# Severity
- { name: "sev:blocker", color: 5c0000, description: "Crash at start, data loss, vulnerability" }
- { name: "sev:critical", color: b60205, description: "Main feature unusable, no workaround" }
- { name: "sev:major", color: e99695, description: "Feature degraded, workaround available" }
- { name: "sev:minor", color: f9d0c4, description: "Cosmetic or marginal" }
# Found in
- { name: "found-in:dev", color: bfdadc, description: "Found in a dev build" }
- { name: "found-in:rc", color: bfdadc, description: "Found in a release candidate" }
- { name: "found-in:release", color: bfdadc, description: "Found in a release" }
# Development mode
- { name: ai-agent, color: 7057ff, description: "Done by an autonomous AI agent, then reviewed" }
- { name: ai-assisted, color: 8a63d2, description: "A developer guides, the AI writes" }
- { name: ai-generated, color: 7057ff, description: "PR with code generated by AI" }
- { name: manual, color: c5def5, description: "Written by hand" }
# Status
- { name: needs-triage, color: fef2c0, description: "New, to be evaluated" }
- { name: needs-info, color: fef2c0, description: "Waiting for information from the reporter" }
- { name: ready, color: 0e8a16, description: "Priority, milestone and acceptance criteria defined" }
- { name: in-progress, color: 1d76db, description: "Assigned, being worked on" }
- { name: blocked, color: b60205, description: "Waiting for another issue or an external dependency" }
- { name: review, color: 5319e7, description: "Pull request open" }
# Closing
- { name: duplicate, color: cfd3d7, description: "Already reported" }
- { name: not-planned, color: ffffff, description: "Out of scope" }
- { name: invalid, color: e4e669, description: "Not a valid report" }
- { name: wontfix, color: ffffff, description: "Won't be fixed" }
# External contributions
- { name: external, color: f9d0c4, description: "From an external contributor" }
- { name: good first issue, color: 7057ff, description: "Good for newcomers" }
- { name: help wanted, color: 008672, description: "Extra attention is needed" }
# Maintenance
- { name: stale, color: ededed, description: "No activity" }
- { name: keep, color: 0e8a16, description: "Never pruned or marked stale" }
# Milestones and branches
- { name: milestone, color: 1d76db, description: "Tracking issue of a milestone" }
- { name: main-exception, color: b60205, description: "Maintainers only: PR to main that doesn't come from an rc or a hotfix" }
