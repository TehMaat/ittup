name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the dependencies install on (patool 4 needs 3.11) and the newest one
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The end-to-end tests make dummy videos with ffmpeg and check them with ffprobe
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ITTup
        run: pip install -e . pytest

      - name: Unit tests
        run: pytest -q --ignore=tests/e2e

      # The ittup command on dummy files, with a fake tracker, TMDB, TVDB and image hosts
      - name: End-to-end tests
        run: pytest -v tests/e2e
