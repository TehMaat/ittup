[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["dependencies"]
name = "ittup"
version = "1.2.1"
description = "ItaTorrents uploader"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Parzival" },
    { name = "TehMaat" }
]

[project.urls]
Homepage = "https://github.com/TehMaat/ittup"
Repository = "https://github.com/TehMaat/ittup"
Issues = "https://github.com/TehMaat/ittup/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["ittup*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }


[project.scripts]
ittup = "ittup.core.__main__:main"
